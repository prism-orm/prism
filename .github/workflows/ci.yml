name: CI

on:
    push:
        # gitflow : main reçoit les releases, dev les features
        branches: [main, dev]
        tags: ['v*']
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Style et analyse statique
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
                  coverage: none
            - uses: ramsey/composer-install@v3
            - run: vendor/bin/php-cs-fixer fix --dry-run --diff
            - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

    tests:
        name: PHP ${{ matrix.php }} · ${{ matrix.db }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
                db: [mysql, mariadb, pgsql, sqlite]
                include:
                    - db: mysql
                      url: 'mysql://root:root@127.0.0.1:3306/prism_test?serverVersion=8.4'
                    - db: mariadb
                      url: 'mysql://root:root@127.0.0.1:3307/prism_test?serverVersion=11.8.0-MariaDB'
                    - db: pgsql
                      url: 'postgresql://prism:prism@127.0.0.1:5432/prism_test?serverVersion=16'
                    - db: sqlite
                      url: 'sqlite:///:memory:'
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: prism_test
                    MYSQL_USER: prism
                    MYSQL_PASSWORD: prism
                ports: ['3306:3306']
                options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=5s --health-retries=20
            mariadb:
                image: mariadb:11.8
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: prism_test
                    MARIADB_USER: prism
                    MARIADB_PASSWORD: prism
                ports: ['3307:3306']
                options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_DB: prism_test
                    POSTGRES_USER: prism
                    POSTGRES_PASSWORD: prism
                ports: ['5432:5432']
                options: --health-cmd="pg_isready -U prism -d prism_test" --health-interval=5s --health-retries=20
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
                  coverage: pcov
            - uses: ramsey/composer-install@v3
            - name: Tests unitaires
              run: vendor/bin/phpunit --testsuite unit
            - name: Tests fonctionnels
              run: vendor/bin/phpunit --testsuite functional
              env:
                  DATABASE_URL: ${{ matrix.url }}

    # ADR 0013, section 7 : le bundle sous Symfony 7.4 (le lock suit la dernière version, 8.x) ;
    # une seule base, le bundle n'a pas de SQL. Lent : sur les push, pas sur chaque PR.
    symfony-74:
        name: Bundle · Symfony 7.4
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: prism_test
                ports: ['3306:3306']
                options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=5s --health-retries=20
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_mysql, pdo_sqlite
                  coverage: none
            - uses: ramsey/composer-install@v3
            - run: tools/compat/symfony-version.sh 7.4
              env:
                  DATABASE_URL: 'mysql://root:root@127.0.0.1:3306/prism_test?serverVersion=8.4'

    # phase 7, étape 8 : une vraie application, sa recette, puis make:entity → migration → migrate
    compat:
        name: Compat · Symfony ${{ matrix.symfony }} · ${{ matrix.app }}
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                symfony: ['7.4', '8']
                app: [skeleton, webapp]
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_sqlite
                  coverage: none
                  tools: composer
            - run: tools/compat/compat.sh ${{ matrix.symfony }} ${{ matrix.app }}

    # ADR 0016 : le site de documentation ; le build échoue sur un lien interne cassé
    website:
        name: Site de documentation
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: website
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: website/package-lock.json
            - run: npm ci --no-fund --no-audit
            - run: npm run build
            # RG-10.3 : les exemples non exécutés, à garder rares (exécutés par website/tests/Functional/ExamplesTest)
            - name: Exemples marqués no-run
              working-directory: .
              run: grep -rn --include='*.md' --exclude-dir=node_modules -E '^ {0,3}(```|~~~)php[^ ]*.* no-run' website packages/*/docs || echo 'Aucun.'
            # le site construit, publié sur GitHub Pages par le job pages (ADR 0016)
            - uses: actions/upload-artifact@v4
              with:
                  name: website
                  path: website/.vitepress/dist

    # ADR 0016 : le même script que make docs-publish, qui reste le secours sans Actions
    pages:
        name: Publication du site (GitHub Pages)
        needs: [quality, tests, website]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  name: website
                  path: website/.vitepress/dist
            - run: tools/pages/publish.sh
              env:
                  PUSH: '1'
                  REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

    split:
        name: Split vers prism-orm/*
        needs: [quality, tests]
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: ./.github/workflows/split.yml
        secrets:
            SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
