services:
    php:
        build: docker/php
        volumes:
            - .:/app
        environment:
            COMPOSER_CACHE_DIR: /app/var/composer
        depends_on:
            mysql: { condition: service_healthy }
            mariadb: { condition: service_healthy }
            postgres: { condition: service_healthy }

    # la démo en mode worker : docker compose --profile demo up -d frankenphp (make worker-up)
    frankenphp:
        build: docker/frankenphp
        profiles: [demo]
        volumes:
            - .:/app
        working_dir: /app/demo
        environment:
            SERVER_NAME: ':80'
            FRANKENPHP_CONFIG: 'worker ./public/index.php 1'
            APP_ENV: prod
            APP_DEBUG: '0'
            APP_SECRET: demo-not-a-secret
            DATABASE_URL: 'mysql://root:root@mysql:3306/prism_demo?serverVersion=8.4'
            # en-têtes de mesure (mémoire, identity map) pour make worker-test
            PRISM_WORKER_PROBE: '1'
        ports: ["${PRISM_DEMO_PORT:-8088}:80"]
        depends_on:
            mysql: { condition: service_healthy }

    # le site de documentation (ADR 0016) : make docs-dev, make docs-build
    node:
        image: node:22-alpine
        profiles: [docs]
        volumes:
            - .:/app
        working_dir: /app/website
        environment:
            npm_config_cache: /app/var/npm
        ports: ["${PRISM_DOCS_PORT:-5173}:5173"]

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: prism_test
            MYSQL_USER: prism
            MYSQL_PASSWORD: prism
        ports: ["${PRISM_MYSQL_PORT:-3306}:3306"]
        tmpfs: [/var/lib/mysql]
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
            interval: 3s
            retries: 30

    mariadb:
        # 11.8 LTS : première LTS avec le type VECTOR natif (pilier 4)
        image: mariadb:11.8
        environment:
            MARIADB_ROOT_PASSWORD: root
            MARIADB_DATABASE: prism_test
            MARIADB_USER: prism
            MARIADB_PASSWORD: prism
        ports: ["${PRISM_MARIADB_PORT:-3307}:3306"]
        tmpfs: [/var/lib/mysql]
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 3s
            retries: 30

    postgres:
        # image officielle Postgres 16 avec l'extension pgvector (pilier 4)
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_DB: prism_test
            POSTGRES_USER: prism
            POSTGRES_PASSWORD: prism
        ports: ["${PRISM_POSTGRES_PORT:-5432}:5432"]
        tmpfs: [/var/lib/postgresql/data]
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U prism -d prism_test"]
            interval: 3s
            retries: 30
