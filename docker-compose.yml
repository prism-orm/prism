services:
    php:
        build: docker/php
        volumes:
            - .:/app
        environment:
            COMPOSER_CACHE_DIR: /app/var/composer
        depends_on:
            mysql: { condition: service_healthy }
            mariadb: { condition: service_healthy }
            postgres: { condition: service_healthy }

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: prism_test
            MYSQL_USER: prism
            MYSQL_PASSWORD: prism
        ports: ["${PRISM_MYSQL_PORT:-3306}:3306"]
        tmpfs: [/var/lib/mysql]
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
            interval: 3s
            retries: 30

    mariadb:
        # 11.8 LTS : première LTS avec le type VECTOR natif (pilier 4)
        image: mariadb:11.8
        environment:
            MARIADB_ROOT_PASSWORD: root
            MARIADB_DATABASE: prism_test
            MARIADB_USER: prism
            MARIADB_PASSWORD: prism
        ports: ["${PRISM_MARIADB_PORT:-3307}:3306"]
        tmpfs: [/var/lib/mysql]
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 3s
            retries: 30

    postgres:
        # image officielle Postgres 16 avec l'extension pgvector (pilier 4)
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_DB: prism_test
            POSTGRES_USER: prism
            POSTGRES_PASSWORD: prism
        ports: ["${PRISM_POSTGRES_PORT:-5432}:5432"]
        tmpfs: [/var/lib/postgresql/data]
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U prism -d prism_test"]
            interval: 3s
            retries: 30
